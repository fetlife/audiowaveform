[workspace]
members = [
    "crates/audiowaveform",
    "crates/audiowaveform-cli",
]
resolver = "2"

[workspace.package]
version = "1.10.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/fetlife/audiowaveform"
authors = ["Andrii Dmytrenko", "BBC Research and Development"]

[workspace.dependencies]
assert_cmd = "2.2.2"
byteorder = "1.5.0"
clap = { version = "4.6.1", features = ["derive"] }
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
png = "0.18.1"
predicates = "3.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
symphonia = { version = "0.6.0", default-features = false, features = ["flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tempfile = "3.27.0"
thiserror = "2.0.18"

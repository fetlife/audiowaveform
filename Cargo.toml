[workspace]
members = [
    "crates/audiowaveform",
    "crates/audiowaveform-cli",
]
resolver = "2"

[workspace.package]
version = "1.10.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/bbc/audiowaveform"
authors = ["Andrii Dmytrenko", "BBC Research and Development"]

[workspace.dependencies]
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2.0"
